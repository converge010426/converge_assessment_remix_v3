name: Restore approved landing hero

on:
  push:
    paths:
      - '.github/workflows/restore-approved-hero.yml'

permissions:
  contents: write

jobs:
  restore-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the approved static hero from the last known source asset
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow cairosvg
          git show 7816c1f645171faa9d59cfac6d42328bf2a47e43:public/converge-hero.png > /tmp/base.png
          cat > /tmp/overlay.svg <<'SVG'
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" preserveAspectRatio="none">
<defs><linearGradient id="eq-panel" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4b2d76"/><stop offset="100%" stop-color="#603793"/></linearGradient></defs>
