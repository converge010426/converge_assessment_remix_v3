<text x="1298" y="620">The comprehensive assessment</text><text x="1298" y="646">plus a job-specific Candidate</text><text x="1298" y="672">Suitability Analysis.</text><rect x="1201" y="676" width="194" height="2" fill="#248743"/>
</g>
<rect x="0" y="862" width="705" height="151" fill="#022340"/>
<text x="72" y="912" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#59bf3e">THREE PERSPECTIVES.</text>
<text x="72" y="946" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">One integrated view of how</text>
<text x="72" y="974" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">you think, behave and relate.</text>
</svg>
SVG
          python - <<'PY2'
import cairosvg
from PIL import Image
cairosvg.svg2png(url='/tmp/overlay.svg', write_to='/tmp/overlay.png', output_width=1536, output_height=1024)
base=Image.open('/tmp/base.png').convert('RGBA')
overlay=Image.open('/tmp/overlay.png').convert('RGBA')
Image.alpha_composite(base, overlay).save('public/converge-hero.png', optimize=True)
PY2
          rm -f src/heroFinalFix.ts
          rm -f .github/workflows/restore-approved-hero.yml
          git config user.name "CONVERGE Assessments"
          git config user.email "tomknsn@gmail.com"
          git add public/converge-hero.png .github/workflows/restore-approved-hero.yml
          git commit -m "Restore approved static landing hero"
          git push origin HEAD:main
